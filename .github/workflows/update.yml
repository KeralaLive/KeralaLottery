name: Lottery Update

on:
  schedule:
    - cron: '45 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Fetch Result
        run: |
          pip install requests beautifulsoup4
          python -c "
          import requests, re, json, os
          from bs4 import BeautifulSoup
          from datetime import datetime

          try:
              r = requests.get('https://www.keralalottery.info/', timeout=30, headers={'User-Agent':'Mozilla/5.0'})
              soup = BeautifulSoup(r.text, 'html.parser')
              text = soup.get_text(' ', strip=True)
              print(text[:5000])

              numbers = re.findall(r'\b[A-Z]{1,2}\s*\d{6}\b', text)
              print('Found numbers:', numbers)

              data = {
                  'date': datetime.now().strftime('%d-%m-%Y'),
                  'updated_at': datetime.now().strftime('%d-%m-%Y %I:%M %p'),
                  'source_text': text[:5000],
                  'numbers': numbers
              }
              with open('result.json','w') as f:
                  json.dump(data, f, indent=2)

              fname = 'KarunyaPlusKN-650Result.html'
              if os.path.exists(fname):
                  with open(fname,'r',encoding='utf-8',errors='ignore') as f:
                      html = f.read()

                  # 1. Pazhaya live-result adiyil undel athu kalayu
                  html = re.sub(r'<div id=\"live-result\">.*?</div>', '', html, flags=re.DOTALL)

                  # 2. Puthiya box - MUGALIL varan
                  new_box = f'''<div id=\"live-result\" style=\"background:#fff3cd;border:2px solid #ff9800;border-radius:12px;padding:15px;margin:15px;text-align:center;\"><h2 style=\"margin:0;\">Karunya Plus KN-650 - {data[\"date\"]}</h2><p style=\"font-size:16px;line-height:1.6;\">{text[:3000]}</p><p style=\"font-size:12px;color:#555;\">Updated: {data[\"updated_at\"]}</p></div>'''

                  # 3. Header nu thazhe insert cheyyu
                  if '</div>' in html:
                      # header div kazhinju insert
                      parts = html.split('</div>', 1)
                      html = parts[0] + '</div>' + new_box + parts[1]
                  elif '<body>' in html:
                      html = html.replace('<body>', '<body>' + new_box, 1)
                  else:
                      html = new_box + html

                  with open(fname,'w',encoding='utf-8') as f:
                      f.write(html)
                  print(fname + ' updated - TOP')
              else:
                  print(fname + ' not found')
          except Exception as e:
              print('Error', e)
          "

      - name: Commit
        run: |
          git config user.name "Auto Bot"
          git config user.email "bot@keralalive.com"
          git add .
          git commit -m "Auto update 3:15 PM - TOP" || echo "No change"
          git push
