name: Lottery Update
on:
  schedule:
    - cron: '45 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Clean Only
        run: |
          python3 << 'PY'
          import pathlib
          p = pathlib.Path('KarunyaPlusKN-650Result.html')
          html = p.read_text(encoding='utf-8')
          bad = ['Skip to content', 'Menu', 'updated daily']
          lines = [l for l in html.splitlines() if not any(b in l for b in bad)]
          p.write_text('\n'.join(lines), encoding='utf-8')
          print('Cleaned OK')
          PY
      - name: Save
        run: |
          git config user.name 'bot'
          git config user.email 'bot@bot.com'
          git add KarunyaPlusKN-650Result.html
          git commit -m 'clean junk' || echo 'no change'
          git push
