name: Lottery Update
on:
  schedule:
    - cron: '45 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Clean Only
        run: |
          python -c "
          html = open('KarunyaPlusKN-650Result.html', encoding='utf-8').read()
          bad = ['Skip to content','Menu','Home','updated daily at 3:00 PM','weekly chart','monthly chart','guessing numbe','Kerala Jackpot','Result Chart']
          for b in bad:
              # ആ line മുഴുവൻ കളയുക
              lines = [l for l in html.splitlines() if b not in l]
              html = '\n'.join(lines)
          open('KarunyaPlusKN-650Result.html','w',encoding='utf-8').write(html)
          print('Cleaned OK')
          "
      - name: Save
        run: |
          git config user.name 'bot'
          git config user.email 'bot@bot.com'
          git add KarunyaPlusKN-650Result.html
          git commit -m 'clean junk' || echo 'no change'
          git push
