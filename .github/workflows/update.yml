name: Lottery Update
on:
  schedule:
    - cron: '35 9 * * *'
  workflow_dispatch:
    inputs:
      first_prize:
        description: '1st Prize Number'
        required: true
      second_prize:
        description: '2nd Prize Number'
        required: false
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update Today Result
        run: |
          python3 << 'PY'
          import datetime, glob, os
          today = datetime.date.today()
          schedule = {
            0: ("Bhagyathara", "BT"),
            1: ("Sthree Sakthi", "SS"),
            2: ("Dhanalekshmi", "DL"),
            3: ("Karunya Plus", "KN"),
            4: ("Suvarna Keralam", "SK"),
            5: ("Karunya", "KR"),
            6: ("Samrudhi", "SM"),
          }
          name, code = schedule[today.weekday()]
          slug = name.lower().replace(' ', '-')
          filename = f"{slug}-{code}-{today.strftime('%d-%m-%Y')}Result.html"
          print(f"Updating {filename}")
          if not os.path.exists(filename):
              print("File not found, skipping")
              exit(0)
          with open(filename) as f:
              content = f.read()
          first = "${{ github.event.inputs.first_prize }}"
          second = "${{ github.event.inputs.second_prize }}"
          if first:
              content = content.replace("Result Coming Soon", first, 1)
          if second:
              content = content.replace("Result Coming Soon", second, 1)
          content = content.replace("COMING SOON", "RESULT DECLARED")
          with open(filename, "w") as f:
              f.write(content)
          print("Updated!")
          PY
      - name: Save
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update today result" || echo "No changes"
          git push
