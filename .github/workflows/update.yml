name: Auto Lottery Update
on:
  schedule:
    - cron: '45 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Fetch Result
        run: |
          pip install requests beautifulsoup4
          python -c "
          import requests
          from bs4 import BeautifulSoup
          try:
              r = requests.get('https://www.keralalottery.info/', timeout=20, headers={'User-Agent':'Mozilla/5.0'})
              print('Fetched', r.status_code)
              print(r.text[:2000])
          except Exception as e:
              print('Error', e)
          "
      - name: Commit
        run: |
          git config user.name "Auto Bot"
          git config user.email "bot@keralalive.com"
          git add .
          git commit -m "Auto check 3:15 PM" || echo "No change"
          git push
