name: Lottery Update
on:
  schedule:
    - cron: '45 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Fetch Result
        run: |
          pip install requests beautifulsoup4
          python -c "
          import requests, re
          from bs4 import BeautifulSoup
          r = requests.get('https://www.keralalottery.info')
          soup = BeautifulSoup(r.text, 'html.parser')
          for tag in soup(['nav','header','footer','script','style','aside']):
              tag.decompose()
          article = soup.find('article')
          text = article.get_text(' ', strip=True) if article else soup.get_text(' ', strip=True)
          # ചപ്പ് കൂടി കളയുക
          for bad in ['Skip to content','Menu','Home','Kerala Jackpot','Result Chart','Welcome to']:
              text = text.replace(bad, '')
          # index.html ൽ പുതിയ result ഇടുക
          html = open('index.html', encoding='utf-8').read()
          # <!-- RESULT_START --> നും <!-- RESULT_END --> നും ഇടയിൽ മാറ്റും
          new_html = re.sub(r'<!-- RESULT_START -->.*?<!-- RESULT_END -->', '<!-- RESULT_START -->' + text + '<!-- RESULT_END -->', html, flags=re.DOTALL)
          open('index.html','w',encoding='utf-8').write(new_html)
          print('Updated OK')
          "
      - name: Save
        run: |
          git config user.name 'bot'
          git config user.email 'bot@bot.com'
          git add index.html
          git commit -m 'update result' || echo 'no change'
          git push
