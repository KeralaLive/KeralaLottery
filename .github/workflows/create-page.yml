name: Create Tomorrow Page
on:
  schedule:
    - cron: '35 18 * * *'
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Page
        run: |
          python3 << 'PY'
          import datetime, re
          tomorrow = datetime.date.today() + datetime.timedelta(days=1)
          schedule = {
            0: ("Bhagyathara", "bt"),
            1: ("Sthree Sakthi", "ss"),
            2: ("Dhanalekshmi", "dl"),
            3: ("Karunya Plus", "kn"),
            4: ("Suvarna Keralam", "sk"),
            5: ("Karunya", "kr"),
            6: ("Samrudhi", "sm"),
          }
          name, code = schedule[tomorrow.weekday()]
          slug = name.lower().replace(' ', '-')
          # Nalaathe date + result
          filename = f"{slug}-{code}-{tomorrow.strftime('%d-%m-%Y')}-result.html"
          with open("KarunyaPlusKN-650Result.html", "r", encoding="utf-8") as f:
              content = f.read()
          content = content.replace("Karunya Plus KN-650", f"{name} - {tomorrow.strftime('%d-%m-%Y')}")
          with open(filename, "w", encoding="utf-8") as f:
              f.write(content)
          print(f"Created {filename}")
          PY
      - name: Save
        run: |
          git config user.name "Auto Bot"
          git config user.email "bot@keralalive.com"
          git add .
          git commit -m "Auto create tomorrow page" || echo "No change"
          git push
